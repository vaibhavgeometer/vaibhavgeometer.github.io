<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Vaibhav Geometer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📐</text></svg>">
  <link rel="stylesheet" href="css/portfolio.css">

  <script>
    // Automatic routing for lowercase or legacy URLs on GitHub Pages
    (function() {
      var path = window.location.pathname;
      var lower = path.toLowerCase();
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      var sub;

      if (lower === '/portfolio.css' || lower === '/website/portfolio.css' || lower === '/website/css/portfolio.css') {
        window.location.replace('/css/portfolio.css' + search + hash);
        return;
      }

      if (lower === '/website' || lower === '/website/' || lower.indexOf('/website/') === 0) {
        sub = path.replace(/^\/website\/?/i, '');
        window.location.replace('/' + sub + search + hash);
        return;
      }

      if (lower === '/jam' || lower === '/jam/' || lower.indexOf('/jam/') === 0) {
        sub = path.replace(/^\/jam\/?/i, '');
        window.location.replace('/academic/JAM/' + sub + search + hash);
        return;
      }

      if (lower.indexOf('/mock-test') === 0) {
        window.location.replace('/academic/JAM' + path + search + hash);
        return;
      }

      if (lower.indexOf('/countdown') === 0) {
        window.location.replace('/academic/JAM' + path + search + hash);
        return;
      }

      if (lower === '/academic' || lower === '/academic/') {
        window.location.replace('/academic/' + search + hash);
        return;
      }

      if (lower === '/cuet' || lower === '/cuet/' || lower === '/cuet-pg' || lower === '/cuet-pg/') {
        window.location.replace('/academic/CUET-PG/' + search + hash);
        return;
      }

      if (lower.indexOf('/solved status of mnk games.xlsx') !== -1 || lower.indexOf('/solved%20status%20of%20mnk%20games.xlsx') !== -1) {
        window.location.replace('/mnk-games/solved_status_of_mnk_games.xlsx');
        return;
      }

      if (lower.indexOf('/mnk_games') === 0) {
        sub = path.replace(/^\/mnk_games\/?/i, '');
        window.location.replace('/mnk-games/' + sub + search + hash);
        return;
      }

      if (lower === '/board.html' || lower === '/lichess_tic_tac_toe_analysis_board.html' || lower === '/tictactoe' || lower === '/tic-tac-toe' || lower === '/tictactoe/' || lower === '/tic-tac-toe/' || lower === '/analysis' || lower === '/analysis/' || lower === '/ttt' || lower === '/ttt/' || lower === '/gomoku' || lower === '/gomoku/' || lower === '/mnk' || lower === '/mnk/' || lower === '/play' || lower === '/play/' || lower === '/board' || lower === '/board/' || lower === '/stocktic' || lower === '/stocktic/') {
        window.location.replace('/mnk-games/board.html' + search + hash);
        return;
      }

      if (lower === '/mnk_games_theory_and_ai.html' || lower === '/theory' || lower === '/theory/' || lower === '/article' || lower === '/article/' || lower === '/mnk-theory' || lower === '/mnk-theory/' || lower === '/game-theory' || lower === '/game-theory/') {
        window.location.replace('/mnk-games/mnk_games_theory_and_ai.html' + search + hash);
        return;
      }
    })();
  </script>

  <style>
    .error-wrap {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
    }
    .error-code {
      font-size: 6rem;
      font-weight: 900;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 1rem;
    }
    .error-title {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 1rem;
    }
    .error-desc {
      color: var(--text-secondary);
      max-width: 480px;
      margin-bottom: 2rem;
      font-size: 1.05rem;
    }
    .error-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .error-actions a {
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="bg-mesh"></div>

  <div class="error-wrap">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">
      The page you requested does not exist. You may be looking for one of our featured projects or the home page.
    </p>

    <div class="error-actions">
      <a href="academic/JAM/" class="btn-primary">
        <span>🚀</span> <span>IIT JAM Mathematics Portal</span>
      </a>
      <a href="mnk-games/board.html" class="btn-secondary">
        <span>♟️</span> <span>m,n,k-game &amp; generalizations</span>
      </a>
      <a href="mnk-games/solved_status_of_mnk_games.html" class="btn-secondary">
        <span>📊</span> <span>Solved Status Atlas</span>
      </a>
      <a href="mnk-games/mnk_games_theory_and_ai.html" class="btn-secondary">
        <span>📖</span> <span>(m,n,k) Game Theory &amp; AI</span>
      </a>
      <a href="index.html" class="btn-secondary">
        <span>🏠</span> <span>Vaibhav Geometer Home</span>
      </a>
    </div>
  </div>
</body>
</html>
