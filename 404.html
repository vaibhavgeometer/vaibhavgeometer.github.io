<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Vaibhav Priyadarshi</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📐</text></svg>">
  <link rel="stylesheet" href="css/portfolio.css">

  <script>
    // Automatic routing for lowercase or legacy URLs on GitHub Pages
    (function() {
      var path = window.location.pathname;
      var lower = path.toLowerCase();
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      var sub;

      if (lower === '/portfolio.css' || lower === '/website/portfolio.css' || lower === '/website/css/portfolio.css') {
        window.location.replace('/css/portfolio.css' + search + hash);
        return;
      }

      if (lower === '/website' || lower === '/website/' || lower.indexOf('/website/') === 0) {
        sub = path.replace(/^\/website\/?/i, '');
        window.location.replace('/' + sub + search + hash);
        return;
      }

      if (lower === '/jam' || lower === '/jam/' || lower.indexOf('/jam/') === 0) {
        sub = path.replace(/^\/jam\/?/i, '');
        window.location.replace('/academic/JAM/' + sub + search + hash);
        return;
      }

      if (lower.indexOf('/mock-test') === 0) {
        window.location.replace('/academic/JAM' + path + search + hash);
        return;
      }

      if (lower.indexOf('/countdown') === 0) {
        window.location.replace('/academic/JAM' + path + search + hash);
        return;
      }

      if (lower === '/academic' || lower === '/academic/') {
        window.location.replace('/academic/' + search + hash);
        return;
      }

      if (lower === '/academic/semester-exams' || lower === '/academic/semester-exams/' || lower.indexOf('/academic/semester-exams/') === 0) {
        sub = path.replace(/^\/academic\/semester-exams\/?/i, '');
        window.location.replace('/academic/UNPG/' + sub + search + hash);
        return;
      }

      if (lower === '/academic/unpg-results' || lower === '/academic/unpg-results/' || lower.indexOf('/academic/unpg-results/') === 0) {
        sub = path.replace(/^\/academic\/unpg-results\/?/i, '');
        window.location.replace('/academic/UNPG/' + sub + search + ((sub === '' && !hash) ? '#results' : hash));
        return;
      }

      if ((lower === '/academic/unpg' || lower === '/academic/unpg/' || lower.indexOf('/academic/unpg/') === 0) &&
          path.indexOf('/academic/UNPG') !== 0) {
        sub = path.replace(/^\/academic\/unpg\/?/i, '');
        window.location.replace('/academic/UNPG/' + sub + search + hash);
        return;
      }

      if (lower === '/semester-exams' || lower === '/semester-exams/' || lower.indexOf('/semester-exams/') === 0 ||
          lower === '/semester' || lower === '/semester/' || lower.indexOf('/semester/') === 0 ||
          lower === '/sem-exams' || lower === '/sem-exams/' || lower.indexOf('/sem-exams/') === 0) {
        sub = path.replace(/^\/(?:semester-exams|semester|sem-exams)\/?/i, '');
        window.location.replace('/academic/UNPG/' + sub + search + hash);
        return;
      }

      if (lower === '/unpg-results' || lower === '/unpg-results/' || lower.indexOf('/unpg-results/') === 0 ||
          lower === '/results' || lower === '/results/' || lower.indexOf('/results/') === 0) {
        sub = path.replace(/^\/(?:unpg-results|results)\/?/i, '');
        window.location.replace('/academic/UNPG/' + sub + search + ((sub === '' && !hash) ? '#results' : hash));
        return;
      }

      if (lower === '/unpg' || lower === '/unpg/' || lower.indexOf('/unpg/') === 0) {
        sub = path.replace(/^\/unpg\/?/i, '');
        window.location.replace('/academic/UNPG/' + sub + search + hash);
        return;
      }

      if (lower === '/cuet' || lower === '/cuet/' || lower === '/cuet-pg' || lower === '/cuet-pg/') {
        window.location.replace('/academic/CUET-PG/' + search + hash);
        return;
      }

      if (lower === '/contact' || lower === '/contact/' || lower.indexOf('/contact/') === 0) {
        sub = path.replace(/^\/contact\/?/i, '');
        window.location.replace('/contact/' + sub + search + hash);
        return;
      }

      if (lower === '/art' || lower === '/art/' || lower.indexOf('/art/') === 0) {
        sub = path.replace(/^\/art\/?/i, '');
        window.location.replace('/art/' + sub + search + hash);
        return;
      }

    })();
  </script>

  <style>
    .error-wrap {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
    }
    .error-code {
      font-size: 6rem;
      font-weight: 900;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 1rem;
    }
    .error-title {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 1rem;
    }
    .error-desc {
      color: var(--text-secondary);
      max-width: 480px;
      margin-bottom: 2rem;
      font-size: 1.05rem;
    }
    .error-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .error-actions a {
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="bg-mesh"></div>

  <div class="error-wrap">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">
      The page you requested does not exist. You may be looking for one of our featured projects or the home page.
    </p>

    <div class="error-actions">
      <a href="academic/JAM/" class="btn-primary">
        <span>🚀</span> <span>IIT JAM Mathematics Portal</span>
      </a>
      <a href="academic/" class="btn-secondary">
        <span>🎓</span> <span>Academic Portals Hub</span>
      </a>
      <a href="academic/UNPG/" class="btn-secondary">
        <span>🏛️</span> <span>UNPG BSc Math Portal</span>
      </a>
      <a href="art/" class="btn-secondary">
        <span>🎨</span> <span>Art Gallery</span>
      </a>
      <a href="index.html" class="btn-secondary">
        <span>🏠</span> <span>Vaibhav Priyadarshi Home</span>
      </a>
    </div>
  </div>
</body>
</html>
