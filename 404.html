<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Vaibhav Geometer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📐</text></svg>">
  <link rel="stylesheet" href="/css/portfolio.css">

  <script>
    // Automatic routing for lowercase or legacy URLs on GitHub Pages
    (function() {
      var path = window.location.pathname;
      var lower = path.toLowerCase();
      var search = window.location.search || '';
      var hash = window.location.hash || '';

      if (lower === '/jam' || lower === '/jam/' || lower.indexOf('/jam/') === 0) {
        var newPath = '/JAM/' + path.substring(5);
        window.location.replace(newPath + search + hash);
        return;
      }

      if (lower.indexOf('/mock-test') === 0) {
        window.location.replace('/JAM' + path + search + hash);
        return;
      }

      if (lower.indexOf('/countdown') === 0) {
        window.location.replace('/JAM' + path + search + hash);
        return;
      }
    })();
  </script>

  <style>
    .error-wrap {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
    }
    .error-code {
      font-size: 6rem;
      font-weight: 900;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="bg-mesh"></div>

  <div class="error-wrap">
    <div class="error-code">404</div>
    <h1 style="font-size:2rem; font-weight:800; margin-bottom:1rem;">Page Not Found</h1>
    <p style="color:var(--text-secondary); max-width:480px; margin-bottom:2rem; font-size:1.05rem;">
      The page you requested does not exist. You may be looking for the IIT JAM Mathematics Portal or the home page.
    </p>

    <div style="display:flex; gap:1rem; flex-wrap:wrap; justify-content:center;">
      <a href="/JAM/" class="btn-primary" style="text-decoration:none;">
        <span>🚀</span> <span>IIT JAM Mathematics Portal</span>
      </a>
      <a href="/" class="btn-secondary" style="text-decoration:none;">
        <span>🏠</span> <span>Vaibhav Geometer Home</span>
      </a>
    </div>
  </div>
</body>
</html>
